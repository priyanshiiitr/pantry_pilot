[pytest]
# Where the tests live.
testpaths = tests
# Put the project folder on Python's import path, so tests can import `pantrypilot` and `scripts`.
pythonpath = .
# Hide one harmless deprecation warning that comes from inside the Starlette library, not our code.
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
